name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.13.6"
      - name: Check uv lockfile
        run: uv lock --check
      - name: Ruff, spelling and file checks
        run: uvx pre-commit run --all-files --show-diff-on-failure

  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.13.6"
      - name: Install
        # uv reads the Python version from .python-version and the package
        # versions from uv.lock. The dev extra carries Warp and the optional
        # file-format dependencies wherever the package makes them optional.
        run: uv sync --locked --extra dev
      - name: Unit tests (CPU; tests that need a GPU or a missing optional dependency are skipped)
        run: uv run --no-sync -m unittest discover -s tests -v

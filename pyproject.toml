[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warp_febio"
version = "0.1.0"
description = "Readable cardiovascular mechanics prototypes and Warp FEM adapters"
requires-python = ">=3.10"
dependencies = ["warp-lang==1.19.0", "numpy>=1.24,<3", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["black==26.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

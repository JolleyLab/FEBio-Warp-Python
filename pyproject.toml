[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warp_febio"
version = "0.1.0"
description = "GPU-accelerated, differentiable finite element mechanics on Warp, following FEBio formulations"
requires-python = ">=3.10"
# The model and the file readers and writers need only NumPy, so they install
# in 3D Slicer and other environments without Warp. Compiling and running a
# model needs the "warp" extra.
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
warp = ["warp-lang==1.19.0"]
hdf = ["h5py>=3.8"]
dev = ["warp-lang==1.19.0", "h5py>=3.8", "black==26.1.0"]
pilots = ["matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
where = ["src"]

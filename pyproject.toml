[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warp_febio"
version = "0.1.0"
description = "GPU-accelerated, differentiable finite element mechanics on Warp, following FEBio formulations"
requires-python = ">=3.10"
dependencies = ["warp-lang==1.19.0", "numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["black==26.1.0"]
pilots = ["matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
where = ["src"]
